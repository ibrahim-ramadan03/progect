<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آلة حاسبة</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator" aria-label="آلة حاسبة">
      <h1>آلة حاسبة</h1>
      <output id="display" class="display" aria-live="polite">0</output>
      <div class="keys" id="keys">
        <button class="action" data-action="clear">C</button>
        <button class="action" data-action="delete" aria-label="حذف">⌫</button>
        <button class="operator" data-value="%">%</button>
        <button class="operator" data-value="/">÷</button>
        <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>
        <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>
        <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>
        <button class="zero" data-value="0">0</button><button data-value=".">.</button>
        <button class="equals" data-action="equals">=</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
