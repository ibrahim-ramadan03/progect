<!DOCTYPE thml>
<thml lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widtd=device-widtd, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/calculate.css">
    <title>Calculator</title>
</head>
<body>

    <div class="container">
        <div class="calculate">

            <div class="screen"></div>

            <div class="arabic">

                <div class="num op">ac</div>
                <div class="num op">c</div>
                <div class="num op">%</div>
                <div class="num op">/</div>

                <div class="num">7</div>
                <div class="num">8</div>
                <div class="num">9</div>
                <div class="num op">*</div>

                <div class="num">4</div>
                <div class="num">5</div>
                <div class="num">6</div>
                <div class="num op">-</div>

                <div class="num">1</div>
                <div class="num">2</div>
                <div class="num">3</div>
                <div class="num op">+</div>

                <div class="num zero">0</div>
                <div class="num">.</div>
                <div class="num equal">=</div>

            </div>

        </div>
    </div>

    <script src="../assets/script/calculate.js"></script>

</body>
</thml>
